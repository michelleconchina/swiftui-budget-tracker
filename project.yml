name: ExpenseTracker
options:
  bundleIdPrefix: com.michelleconchina
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  ExpenseTracker:
    type: application
    platform: iOS
    sources:
      - path: ExpenseTracker
    info:
      path: ExpenseTracker/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michelleconchina.ExpenseTracker
        TARGETED_DEVICE_FAMILY: "1"
